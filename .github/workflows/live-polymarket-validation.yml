name: Live Polymarket validation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/execute-first-implementation-pass-for-poly-whale-y7dyt3

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Check official Polymarket hosts
        shell: bash
        run: |
          set -euo pipefail
          for host in data-api.polymarket.com gamma-api.polymarket.com clob.polymarket.com; do
            echo "Checking https://${host}"
            curl -sS -I --connect-timeout 15 --max-time 30 "https://${host}/" | head -n 5
          done

      - name: Fixture-free live Polymarket validation
        run: npm run validate:live
